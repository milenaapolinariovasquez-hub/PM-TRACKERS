<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Tracker - ERP Project</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0a1628, #132238, #1a2d4a); min-height: 100vh; padding: 15px; color: #ffffff; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #ffffff; font-size: 1.8rem; margin-bottom: 20px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .section { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .section-title { color: #7dcea0; font-size: 1rem; font-weight: 700; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .section-title:hover { color: #a9dfbf; }
        .toggle-icon { transition: transform 0.3s; }
        .toggle-icon.collapsed { transform: rotate(-90deg); }
        .collapsible { overflow: hidden; transition: max-height 0.3s ease; }
        .collapsible.hidden { max-height: 0 !important; padding: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
        th { background: rgba(26,45,74,0.6); color: #7dcea0; padding: 8px 6px; text-align: left; font-size: 0.72rem; text-transform: uppercase; border-bottom: 2px solid rgba(125,206,160,0.4); }
        td { padding: 7px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top; color: #ffffff; }
        tr:hover { background: rgba(125,206,160,0.08); }
        input, textarea, select { width: 100%; padding: 5px 8px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.15); background: rgba(10,22,40,0.8); color: #ffffff; font-size: 0.75rem; }
        textarea { resize: vertical; min-height: 28px; }
        select { cursor: pointer; }
        .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid #7dcea0; background: rgba(26,45,74,0.5); color: #7dcea0; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s; }
        .btn:hover { background: rgba(125,206,160,0.2); }
        .btn-danger { border-color: #ff5252; color: #ff5252; }
        .btn-danger:hover { background: rgba(255,82,82,0.2); }
        .btn-bar { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .metric-card { background: rgba(26,45,74,0.4); border: 1px solid rgba(125,206,160,0.3); border-radius: 8px; padding: 12px; text-align: center; }
        .metric-value { font-size: 1.6rem; font-weight: 700; color: #7dcea0; }
        .metric-label { font-size: 0.7rem; color: #ccc; margin-top: 4px; }
        .sprint-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .sprint-dates { font-size: 0.75rem; color: #ccc; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div></div>
        <h1>PM Tracker - ERP</h1>
        <div style="font-size:0.75rem;color:#ccc;" id="connection-status">Conectando...</div>
    </div>

    <!-- METRICAS -->
    <div class="section">
        <div class="section-title">Dashboard de Metricas</div>
        <div class="metrics-grid" id="metrics-grid">
            <div class="metric-card"><div class="metric-value" id="m-avance">0%</div><div class="metric-label">% Avance</div></div>
            <div class="metric-card"><div class="metric-value" id="m-completadas">0</div><div class="metric-label">Tareas Completadas</div></div>
            <div class="metric-card"><div class="metric-value" id="m-bugs">0</div><div class="metric-label">Bugs</div></div>
            <div class="metric-card"><div class="metric-value" id="m-dependencias">0</div><div class="metric-label">Dependencias Abiertas</div></div>
            <div class="metric-card"><div class="metric-value" id="m-riesgos">0</div><div class="metric-label">Riesgos Abiertos</div></div>
            <div class="metric-card"><div class="metric-value" id="m-pendientes">0</div><div class="metric-label">Resp. Pendientes Cliente</div></div>
        </div>
    </div>

    <!-- NUEVO SPRINT -->
    <div class="btn-bar">
        <button class="btn" onclick="crearNuevoSprint()">+ Nuevo Sprint</button>
    </div>

    <!-- SPRINTS -->
    <div id="sprints-container"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
    apiKey: "AIzaSyDekcmIKIM8DawV8zrdnBP66DPgfbbyJVI",
    authDomain: "pm-tracker-62f75.firebaseapp.com",
    databaseURL: "https://pm-tracker-62f75-default-rtdb.firebaseio.com",
    projectId: "pm-tracker-62f75",
    storageBucket: "pm-tracker-62f75.firebasestorage.app",
    messagingSenderId: "870693613554",
    appId: "1:870693613554:web:6a89b95a19561ee83d456b"
});

const db = firebase.database();
const sprintsRef = db.ref('sprints');

db.ref('.info/connected').on('value', snap => {
    document.getElementById('connection-status').textContent = snap.val() ? 'Conectado' : 'Sin conexion';
    document.getElementById('connection-status').style.color = snap.val() ? '#7dcea0' : '#ff5252';
});

sprintsRef.on('value', snap => {
    const data = snap.val() || {};
    renderSprints(data);
    calcularMetricas(data);
});

function crearNuevoSprint() {
    sprintsRef.once('value').then(snap => {
        const data = snap.val() || {};
        const num = Object.keys(data).length + 1;
        const hoy = new Date();
        const inicio = hoy.toISOString().split('T')[0];
        const fin = new Date(hoy.getTime() + 6*24*60*60*1000).toISOString().split('T')[0];
        sprintsRef.push({ nombre: 'Sprint ' + num, fechaInicio: inicio, fechaFin: fin, tareas: {} });
    });
}

function actualizarSprint(sprintId, campo, valor) {
    sprintsRef.child(sprintId).child(campo).set(valor);
}

function agregarTarea(sprintId) {
    sprintsRef.child(sprintId).child('tareas').push({
        tarea: '', dod: '', responsable: '', fechaCompromiso: '',
        estado: 'pendiente', dependencias: '', riesgos: '',
        esBug: false, respPendienteCliente: false
    });
}

function actualizarTarea(sprintId, tareaId, campo, valor) {
    sprintsRef.child(sprintId).child('tareas').child(tareaId).child(campo).set(valor);
}

function eliminarTarea(sprintId, tareaId) {
    if (confirm('Eliminar esta tarea?')) {
        sprintsRef.child(sprintId).child('tareas').child(tareaId).remove();
    }
}

function eliminarSprint(sprintId) {
    if (confirm('Eliminar este sprint completo?')) {
        sprintsRef.child(sprintId).remove();
    }
}

function actualizarSprint(sprintId, campo, valor) {
    sprintsRef.child(sprintId).child(campo).set(valor);
}

function renderSprints(data) {
    const container = document.getElementById('sprints-container');
    const sprintKeys = Object.keys(data).reverse();
    let html = '';

    sprintKeys.forEach((key, idx) => {
        const sprint = data[key];
        const tareas = sprint.tareas || {};
        const tareaKeys = Object.keys(tareas);
        const isFirst = idx === 0;

        html += '<div class="section">';
        html += '<div class="section-title" onclick="toggleSprint(\'' + key + '\')">';
        html += '<span class="toggle-icon" id="icon-' + key + '"' + (!isFirst ? ' style="transform:rotate(-90deg)"' : '') + '>&#9660;</span> ';
        html += '<span class="sprint-header"><span>' + sprint.nombre + '</span>';
        html += '<span class="sprint-dates">';
        html += '<input type="date" value="' + (sprint.fechaInicio || '') + '" style="width:130px;margin-right:5px;" onchange="actualizarSprint(\'' + key + '\',\'fechaInicio\',this.value)" onclick="event.stopPropagation()">';
        html += ' al ';
        html += '<input type="date" value="' + (sprint.fechaFin || '') + '" style="width:130px;margin-left:5px;" onchange="actualizarSprint(\'' + key + '\',\'fechaFin\',this.value)" onclick="event.stopPropagation()">';
        html += '</span></span>';
        html += '</div>';
        html += '<div class="collapsible" id="body-' + key + '"' + (!isFirst ? ' style="max-height:0;overflow:hidden;"' : '') + '>';

        html += '<table><thead><tr><th>Tarea</th><th>DoD</th><th>Responsable</th><th>Fecha</th><th>Estado</th><th>Dependencias</th><th>Riesgos</th><th>Bug</th><th>Pend.Cliente</th><th></th></tr></thead><tbody>';

        tareaKeys.forEach(tKey => {
            const t = tareas[tKey];
            html += '<tr>';
            html += '<td><input value="' + esc(t.tarea) + '" onchange="actualizarTarea(\'' + key + '\',\'' + tKey + '\',\'tarea\',this.value)"></td>';
            html += '<td><textarea onchange="actualizarTarea(\'' + key + '\',\'' + tKey + '\',\'dod\',this.value)">' + esc(t.dod) + '</textarea></td>';
            html += '<td><input value="' + esc(t.responsable) + '" onchange="actualizarTarea(\'' + key + '\',\'' + tKey + '\',\'responsable\',this.value)"></td>';
            html += '<td><input type="date" value="' + esc(t.fechaCompromiso) + '" onchange="actualizarTarea(\'' + key + '\',\'' + tKey + '\',\'fechaCompromiso\',this.value)"></td>';
            html += '<td><select onchange="actualizarTarea(\'' + key + '\',\'' + tKey + '\',\'estado\',this.value)">';
            ['pendiente','en progreso','completada','bloqueada'].forEach(st => {
                html += '<option value="' + st + '"' + (t.estado === st ? ' selected' : '') + '>' + st + '</option>';
            });
            html += '</select></td>';
            html += '<td><textarea onchange="actualizarTarea(\'' + key + '\',\'' + tKey + '\',\'dependencias\',this.value)">' + esc(t.dependencias) + '</textarea></td>';
            html += '<td><textarea onchange="actualizarTarea(\'' + key + '\',\'' + tKey + '\',\'riesgos\',this.value)">' + esc(t.riesgos) + '</textarea></td>';
            html += '<td><input type="checkbox"' + (t.esBug ? ' checked' : '') + ' onchange="actualizarTarea(\'' + key + '\',\'' + tKey + '\',\'esBug\',this.checked)"></td>';
            html += '<td><input type="checkbox"' + (t.respPendienteCliente ? ' checked' : '') + ' onchange="actualizarTarea(\'' + key + '\',\'' + tKey + '\',\'respPendienteCliente\',this.checked)"></td>';
            html += '<td><button class="btn btn-danger" onclick="eliminarTarea(\'' + key + '\',\'' + tKey + '\')">X</button></td>';
            html += '</tr>';
        });

        html += '</tbody></table>';
        html += '<div class="btn-bar"><button class="btn" onclick="agregarTarea(\'' + key + '\')">+ Tarea</button>';
        html += '<button class="btn btn-danger" onclick="eliminarSprint(\'' + key + '\')">Eliminar Sprint</button></div>';
        html += '</div></div>';
    });

    container.innerHTML = html;
}

function toggleSprint(key) {
    const body = document.getElementById('body-' + key);
    const icon = document.getElementById('icon-' + key);
    if (body.style.maxHeight === '0px') {
        body.style.maxHeight = '2000px';
        body.style.overflow = 'visible';
        icon.style.transform = 'rotate(0deg)';
    } else {
        body.style.maxHeight = '0px';
        body.style.overflow = 'hidden';
        icon.style.transform = 'rotate(-90deg)';
    }
}

function calcularMetricas(data) {
    let total = 0, completadas = 0, bugs = 0, depAbiertas = 0, riesgosAbiertos = 0, pendCliente = 0;
    Object.values(data).forEach(sprint => {
        const tareas = sprint.tareas || {};
        Object.values(tareas).forEach(t => {
            total++;
            if (t.estado === 'completada') completadas++;
            if (t.esBug) bugs++;
            if (t.dependencias && t.dependencias.trim() && t.estado !== 'completada') depAbiertas++;
            if (t.riesgos && t.riesgos.trim() && t.estado !== 'completada') riesgosAbiertos++;
            if (t.respPendienteCliente) pendCliente++;
        });
    });
    const avance = total > 0 ? Math.round((completadas / total) * 100) : 0;
    document.getElementById('m-avance').textContent = avance + '%';
    document.getElementById('m-completadas').textContent = completadas + '/' + total;
    document.getElementById('m-bugs').textContent = bugs;
    document.getElementById('m-dependencias').textContent = depAbiertas;
    document.getElementById('m-riesgos').textContent = riesgosAbiertos;
    document.getElementById('m-pendientes').textContent = pendCliente;
}

function esc(str) { return (str || '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
</script>
</body>
</html>
